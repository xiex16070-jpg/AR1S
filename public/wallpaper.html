<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR1S Wallpaper</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    #bg-video{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:cover;opacity:0;transition:opacity .8s;z-index:1}
    #bg-video.active{opacity:1}
    canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
    #lyrics-overlay{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
    #lyrics-text{font-size:clamp(28px,4.5vw,62px);font-weight:700;color:#fff;text-align:center;max-width:82vw;line-height:1.25;text-shadow:0 2px 28px rgba(0,0,0,.60),0 0 72px rgba(0,0,0,.40),0 0 120px rgba(0,0,0,.25);letter-spacing:.01em}
    #song-indicator{position:absolute;right:28px;bottom:28px;z-index:4;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.38);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px 18px 10px 10px;max-width:420px;opacity:0;transition:opacity .6s}
    #song-indicator.visible{opacity:1}
    #song-indicator-cover{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.06)}
    #song-indicator-info{min-width:0}
    #song-indicator-title{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
    #song-indicator-artist{font-size:11px;color:rgba(255,255,255,.52);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    #ar1s-watermark{position:absolute;left:28px;bottom:28px;z-index:4;font-size:11px;color:rgba(255,255,255,.22);letter-spacing:.08em;opacity:0;transition:opacity .6s}
    #ar1s-watermark.visible{opacity:1}
  </style>
</head>
<body>
  <video id="bg-video" muted loop playsinline></video>
  <canvas id="wall"></canvas>
  <div id="lyrics-overlay"><div id="lyrics-text"></div></div>
  <div id="song-indicator">
    <img id="song-indicator-cover" src="" alt="">
    <div id="song-indicator-info">
      <div id="song-indicator-title"></div>
      <div id="song-indicator-artist"></div>
    </div>
  </div>
  <div id="ar1s-watermark">AR1S</div>
  <script>
    'use strict';
    var canvas = document.getElementById('wall');
    var bgVideo = document.getElementById('bg-video');
    var lyricsEl = document.getElementById('lyrics-text');
    var indicator = document.getElementById('song-indicator');
    var indicatorCover = document.getElementById('song-indicator-cover');
    var indicatorTitle = document.getElementById('song-indicator-title');
    var indicatorArtist = document.getElementById('song-indicator-artist');
    var watermark = document.getElementById('ar1s-watermark');
    var ctx = canvas.getContext('2d', { alpha:false });
    var W = 1, H = 1, dpr = 1;
    var state = {
      enabled:false,title:'AR1S',artist:'',cover:'',playing:false,preset:0,opacity:1,
      lyrics:'',lyricsProgress:0,backgroundMedia:null,
      colors:{primary:'#d6f8ff',secondary:'#9cffdf',highlight:'#fff0b8',glow:'#9cffdf'}
    };
    var coverImg = null, coverSrc = '';
    var videoSrc = '', videoPlaying = false;
    var particles = [];
    function hexToRgb(hex, fallback){
      hex = String(hex || fallback || '#9cffdf').trim();
      if (/^#[0-9a-f]{3}$/i.test(hex)) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
      if (!/^#[0-9a-f]{6}$/i.test(hex)) hex = fallback || '#9cffdf';
      return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
    }
    function rgba(hex, a){
      var c = hexToRgb(hex);
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
    }
    function rand(seed){ return Math.abs(Math.sin(seed * 3187.917) * 43758.5453) % 1; }
    function ensureParticles(){
      var target = Math.min(760, Math.max(420, Math.round((innerWidth * innerHeight) / 4200)));
      while (particles.length < target) {
        var i = particles.length + 1;
        particles.push({ seed:i * 11.37, x:rand(i), y:rand(i * 2.7), lane:rand(i * 5.9), z:rand(i * 8.1), size:.6 + rand(i * 4.2) * 2.4 });
      }
      if (particles.length > target + 80) particles.length = target;
    }
    function resize(){
      dpr = Math.min(1.35, Math.max(1, window.devicePixelRatio || 1));
      W = Math.max(1, Math.floor(innerWidth * dpr));
      H = Math.max(1, Math.floor(innerHeight * dpr));
      canvas.width = W; canvas.height = H;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ensureParticles();
    }
    function setCover(src){
      src = String(src || '');
      if (src === coverSrc) return;
      coverSrc = src;
      coverImg = null;
      if (!src) return;
      var img = new Image();
      img.onload = function(){ if (coverSrc === src) coverImg = img; };
      img.onerror = function(){ if (coverSrc === src) coverImg = null; };
      img.src = src;
    }
    function setVideo(src) {
      src = String(src || '');
      if (src === videoSrc) return;
      videoSrc = src;
      if (!src) {
        bgVideo.classList.remove('active');
        bgVideo.pause();
        bgVideo.removeAttribute('src');
        bgVideo.load();
        videoPlaying = false;
        return;
      }
      if (bgVideo.getAttribute('src') !== src) {
        bgVideo.setAttribute('src', src);
        bgVideo.load();
      }
      bgVideo.muted = true;
      bgVideo.loop = true;
      bgVideo.playsInline = true;
      var p = bgVideo.play();
      if (p && p.catch) p.catch(function(){});
      bgVideo.classList.add('active');
      videoPlaying = true;
    }
    function updateLyrics() {
      var text = state.lyrics || '';
      lyricsEl.textContent = text;
      lyricsEl.style.opacity = text ? '.88' : '0';
    }
    function updateIndicator() {
      var hasInfo = !!(state.title && state.title !== 'AR1S') || !!(state.artist);
      if (hasInfo && state.playing) {
        indicator.classList.add('visible');
        watermark.classList.add('visible');
        indicatorTitle.textContent = state.title || 'AR1S';
        indicatorArtist.textContent = state.artist || '';
        if (state.cover && indicatorCover.getAttribute('src') !== state.cover) {
          indicatorCover.src = state.cover;
        }
      } else {
        indicator.classList.remove('visible');
        watermark.classList.remove('visible');
      }
    }
    function applyState(next){
      var prevCover = state.cover;
      var prevMedia = state.backgroundMedia;
      state = Object.assign({}, state, next || {});
      state.colors = Object.assign({}, state.colors, next && next.colors || {});
      if (state.cover !== prevCover) setCover(state.cover || '');
      var newMedia = state.backgroundMedia;
      if (newMedia && newMedia.url) {
        if (!prevMedia || newMedia.url !== prevMedia.url) setVideo(newMedia.url);
      } else if (prevMedia && prevMedia.url) {
        setVideo('');
      }
      updateLyrics();
      updateIndicator();
    }
    function drawCover(now){
      if (!coverImg) return;
      var side = Math.min(innerWidth, innerHeight) * (.42 + Math.sin(now * .21) * .012);
      var x = innerWidth * .5 - side * .5;
      var y = innerHeight * .50 - side * .5 + Math.sin(now * .37) * 8;
      ctx.save();
      ctx.globalAlpha = .16 * (state.opacity || 1);
      ctx.filter = 'blur(28px) saturate(1.25)';
      ctx.drawImage(coverImg, x - side * .12, y - side * .12, side * 1.24, side * 1.24);
      ctx.filter = 'none';
      ctx.globalAlpha = .20 * (state.opacity || 1);
      ctx.drawImage(coverImg, x, y, side, side);
      ctx.restore();
    }
    function draw(nowMs){
      var now = nowMs * .001;
      ensureParticles();
      var opacity = Math.max(.35, Math.min(1, state.opacity || 1));
      var primary = state.colors.primary || '#d6f8ff';
      var secondary = state.colors.secondary || '#9cffdf';
      var highlight = state.colors.highlight || '#fff0b8';
      var glow = state.colors.glow || secondary;
      var bg = ctx.createLinearGradient(0,0,innerWidth,innerHeight);
      bg.addColorStop(0, videoPlaying ? 'rgba(0,0,0,.05)' : '#050608');
      bg.addColorStop(.52, rgba(primary, videoPlaying ? .06 * opacity : .12 * opacity));
      bg.addColorStop(1, rgba(secondary, videoPlaying ? .05 * opacity : .10 * opacity));
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = bg;
      ctx.fillRect(0,0,innerWidth,innerHeight);
      if (!videoPlaying) drawCover(now);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var cx = innerWidth * .5;
      var cy = innerHeight * .5 + Math.sin(now * .28) * innerHeight * .018;
      var rx = innerWidth * .40;
      var ry = innerHeight * .30;
      for (var i=0;i<particles.length;i++) {
        var p = particles[i];
        var speed = .009 + rand(p.seed) * .021 + (state.playing ? .010 : 0);
        var a = (p.x * Math.PI * 2 + now * speed + Math.sin(now * .07 + p.seed) * .14) % (Math.PI * 2);
        var ring = .18 + p.z * .82;
        var wobble = Math.sin(now * (.22 + rand(p.seed) * .18) + p.seed) * 12;
        var x = cx + Math.cos(a) * rx * ring + Math.sin(now * .11 + p.seed) * 24;
        var y = cy + Math.sin(a * (1.0 + rand(p.seed * 2) * .16)) * ry * ring + wobble;
        var tw = Math.pow(.5 + .5 * Math.sin(now * (.50 + rand(p.seed)*.42) + p.seed), 4);
        var r = Math.max(.7, p.size * (.8 + tw * 1.2));
        var col = tw > .74 ? highlight : (p.lane > .55 ? secondary : glow);
        ctx.globalAlpha = ((videoPlaying ? .025 : .045) + tw * (videoPlaying ? .10 : .18) + (state.playing ? .035 : 0)) * opacity;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(x,y,r,0,Math.PI*2);
        ctx.fill();
      }
      var aura = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(innerWidth,innerHeight)*.54);
      aura.addColorStop(0, rgba(highlight, videoPlaying ? .07 * opacity : .12 * opacity));
      aura.addColorStop(.34, rgba(secondary, videoPlaying ? .05 * opacity : .08 * opacity));
      aura.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = .9;
      ctx.fillStyle = aura;
      ctx.fillRect(0,0,innerWidth,innerHeight);
      ctx.restore();
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize();
    if (window.desktopOverlay && window.desktopOverlay.onWallpaperState) {
      window.desktopOverlay.onWallpaperState(applyState);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
